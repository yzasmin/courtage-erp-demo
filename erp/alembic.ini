; Configuration Alembic. L'adresse de la base n'est pas ecrite ici : elle vient de
; `courtage.config.parametres`, qui lit l'environnement. Un seul endroit sait quel moteur est utilise.

[alembic]
script_location = migrations
prepend_sys_path = src
; Les revisions sont numerotees a la main (0001, 0002...) et non par identifiant aleatoire : l'ordre se
; lit alors directement dans le nom du fichier, ce qui compte quand on relit un historique de reprise.
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
